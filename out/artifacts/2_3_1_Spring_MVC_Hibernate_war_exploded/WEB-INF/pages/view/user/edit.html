<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h2>Редактирование Юзера</h2>

<form th:object="${user}" method="post">
    <input type="hidden" th:field="*{id}""")/>>

    <div>
        <label>Имя:</label>
        <input type="text" th:field="*{name}"/>
    </div>

    <div>
        <label>Фамилия:</label>
        <input type="text" th:field="*{surname}"/>
    </div>

    <div>
        <label>Возраст:</label>
        <input type="number" th:field="*{age}"/>
    </div>

    <button type="submit" th:formaction="@{/update}">Изменить/Добавить</button>
    <button type="submit" th:formaction="@{/delete}">Удалить</button>
</form>
</body>
</html>
