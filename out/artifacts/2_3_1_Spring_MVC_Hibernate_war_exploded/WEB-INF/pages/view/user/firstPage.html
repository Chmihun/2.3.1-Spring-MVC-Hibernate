<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<h2>Список Юзеров</h2>

<table>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.name}">name</td>
        <td th:text="${user.surname}">surname</td>
        <td th:text="${user.age}">age</td>
        <td>
            <a th:href="@{/edit/{id}(id=${user.id})}">Изменить</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${users.isEmpty()}">
    <p>Пользователей пока нет.</p>
    <a th:href="@{/add}">Создать первого пользователя</a>
</div>

<div th:unless="${users.isEmpty()}">

    <br>
    <a th:href="@{/add}">Добавить еще одного</a>
</div>

</body>
</html>
